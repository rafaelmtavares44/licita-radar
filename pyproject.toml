[project]
name = "licita-radar"
version = "0.1.0"
description = "Radar de licitações públicas: lê o PNCP, entende o que a sua empresa vende e avisa só o que vale disputar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rafael" }]
keywords = ["licitacao", "pncp", "compras-publicas", "langgraph", "dados-abertos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary,pool]>=3.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# O matching semântico é opcional de propósito: `licita-radar ingest` e
# `match --sem-semantica` funcionam sem baixar modelo nenhum.
semantico = [
    "fastembed>=0.4",
]
grafo = [
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
]
# Leitura de edital. Fica separado porque `ingest`, `match` e `radar` não
# precisam abrir PDF nenhum — só o `analisar` precisa.
documentos = [
    # >=4.0 pelo extraction_mode="layout": sem ele, número em objeto de
    # texto separado vai parar no fim da linha e some do lugar dele.
    "pypdf>=5.0",
]
# O painel: API HTTP. O front (React/Vite) é construído à parte, em web/.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-python-dateutil>=2.9",
    "fastembed>=0.4",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
licita-radar = "licita_radar.cli:app"

[project.urls]
Repository = "https://github.com/rafaelmtavares44/licita-radar"
Issues = "https://github.com/rafaelmtavares44/licita-radar/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licita_radar"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # o projeto é em PT-BR: acentos e travessões em strings são intencionais
    "RUF002",
    "RUF003",
    # O projeto nomeia em português: `ErroDePerfil` já carrega o sufixo
    # semântico que a regra pede em inglês ("...Error").
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------

[tool.mypy]
# Sem `python_version` fixo de propósito: o mypy passa a assumir a versão do
# interpretador em que está rodando. Fixar em 3.11 fazia o job de 3.12 quebrar
# lendo os stubs do numpy, que usam `type X = ...` (sintaxe só de 3.12+) —
# o erro aparecia num arquivo de terceiro, sem relação com este código.
# A matriz do CI é que garante a compatibilidade: 3.11 é checado como 3.11.
packages = ["licita_radar"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false   # typer usa decorators sem tipo

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# O StateGraph do LangGraph é genérico em quatro parâmetros e sobrecarregado
# em add_node; sob --strict, mypy exige anotações que não acrescentam
# segurança nenhuma e poluem o código do grafo. A correção do estado é
# garantida pelo EditalState e pelos testes de fluxo.
[[tool.mypy.overrides]]
module = ["licita_radar.graph.build"]
# add_node do LangGraph é sobrecarregado sobre um TypeVar ligado a
# TypedDictLikeV1/V2, e o mypy não casa um TypedDict total=False com ele.
# As funções dos nós continuam totalmente tipadas; o que se desliga aqui é
# só a resolução da sobrecarga desta biblioteca.
disable_error_code = ["call-overload"]
disallow_any_generics = false
warn_return_any = false

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integracao: exige Postgres de verdade (pulado por padrão no CI)",
]
